<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIRS mVO₂ Recovery Analyzer</title>
<style>
:root{--bg:#f7f6f2;--panel:#fff;--ink:#1d1c1a;--ink2:#55534e;--mut:#8a877f;--line:#e2e0d8;--accent:#2a78d6;--o2:#d9453f;--hhb:#2a78d6;--warn:#b45309;--ok:#15803d;--bad:#b91c1c;--orange:#e8681f;--green:#16a34a}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0 12px 0 0}
button,.btn{font:inherit;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:#fff;border-radius:7px;cursor:pointer;color:var(--ink)}
button:hover,.btn:hover{border-color:var(--mut)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.small{font-size:11.5px;padding:2px 7px;border-radius:5px}
input[type=number],input[type=text]{font:inherit;font-size:13px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;width:90px}
input[type=text]{width:260px}
.wrap{display:flex;min-height:calc(100vh - 56px)}
aside{width:250px;flex:none;border-right:1px solid var(--line);background:var(--panel);overflow:auto;max-height:calc(100vh - 56px);position:sticky;top:56px}
aside .item{padding:7px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:6px;align-items:center}
aside .item:hover{background:#f2f1ec}
aside .item.sel{background:#e9f1fb}
aside .sid{font-weight:600}
aside .meta{font-size:11.5px;color:var(--ink2)}
.badge{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:10px;margin-left:3px;border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:#bbe5c8;background:#effaf2}
.badge.bad{color:var(--bad);border-color:#f3c4c4;background:#fdf1f1}
.badge.ed{color:var(--warn);border-color:#f2d5a8;background:#fff8ec}
.badge.ex{color:#fff;background:var(--mut);border-color:var(--mut)}
main{flex:1;padding:14px 18px;min-width:0}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 8px}
.card h3{font-size:13.5px;margin:0 0 6px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.row label{display:flex;flex-direction:column;font-size:11.5px;color:var(--ink2);gap:2px}
.row label.inline{flex-direction:row;align-items:center;gap:6px;font-size:13px;color:var(--ink)}
.auto{font-size:11px;color:var(--mut)}
.edited input{border-color:var(--warn);background:#fff8ec}
.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.cuff{border:1px solid var(--line);border-radius:8px;padding:4px 5px 5px;position:relative}
.cuff.excl{opacity:.45}
.cuff .t{font-size:11.5px;display:flex;justify-content:space-between;align-items:center;gap:4px}
.cuff .t b{font-weight:600}
.cuff .flags{min-height:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
th{font-weight:600;background:#f3f2ee;position:sticky;top:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--mut)}
.u{color:var(--ok);font-weight:600}.nu{color:var(--mut)}
svg{display:block;width:100%;height:auto;user-select:none}
svg text{font-family:inherit}
.handle{cursor:ew-resize}
.drop{border:2px dashed var(--line);border-radius:12px;padding:40px;text-align:center;color:var(--ink2);background:var(--panel)}
.drop.hover{border-color:var(--accent);background:#eef5fd}
.help{font-size:12.5px;color:var(--ink2)}
.settings{display:none}.settings.open{display:block}
.legend{font-size:11.5px;color:var(--ink2);display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 6px}
.sw{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:4px}
#status{font-size:12px;color:var(--ink2)}
#print{display:none}
@media print{
  header,aside,main,.wrap,.noprint{display:none!important}
  #print{display:block}
  body{background:#fff}
  .pg{page-break-after:always;padding:6px}
  .pg h2{font-size:15px;margin:0 0 6px}
  #print th{position:static}
  #print table{font-size:9.5px}
  #print tr{page-break-inside:avoid}
  #print .pg:first-child{page-break-after:always}
  .pg .grid6{gap:4px}
  @page{size:landscape;margin:12mm}
}
</style>
</head>
<body>
<header>
  <h1>NIRS mVO₂ Recovery Analyzer</h1>
  <label class="btn">Add .xlsx files<input id="fileIn" type="file" accept=".xlsx" multiple hidden></label>
  <label class="btn">Load protocol CSV<input id="protIn" type="file" accept=".csv,text/csv" hidden></label>
  <label class="btn">Load session<input id="sessIn" type="file" accept=".json" hidden></label>
  <button id="saveSess">Save session</button>
  <button id="expCsv">Export CSVs</button>
  <button id="printBtn">Print / PDF report</button>
  <button id="setBtn">Settings</button>
  <span id="status"></span>
</header>
<div class="wrap">
  <aside id="list"></aside>
  <main id="main"></main>
</div>
<div id="print"></div>
<script>
// NIRS mVO2 recovery analysis engine (browser + Node). Mirrors nirs_mvo2.py.
(function (root) {
"use strict";

const DEFAULTS = {
  o2Col: 6, hhbCol: 7, eventCol: 16, textCol: 17,
  nCuffs: 6, cycle: 10.0, cuffDelay: 5.0,
  refWindow: 0.2, slopeStart: 1.0, slopeTrim: 0.3,
  restStart: 1.0, restEnd: 30.5,
  shiftLo: -2.0, shiftHi: 3.0,
  kLo: 0.5, kHi: 2000.0,
  usableKLo: 5.0, usableKHi: 1990.0, usableR2: 0.80,
  curvatureFlag: 0.1,
};
const FITS = ["1-param", "2-param", "3-param", "anchored"];
const SERIES = ["Series 1 (pre-exercise)", "Series 2 (post-exercise)"];
const MARK_KEYS = ["occl1_start", "series1_start", "occl2_start", "series2_start"];

// ------------------------------------------------------------ xlsx reading
async function inflateRaw(bytes) {
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

async function unzip(buf, wanted) {
  const u8 = new Uint8Array(buf), dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 70000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Not a valid .xlsx (zip) file");
  const n = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = {}, dec = new TextDecoder();
  for (let k = 0; k < n; k++) {
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const local = dv.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    if (!wanted(name)) continue;
    const lnlen = dv.getUint16(local + 26, true), lxlen = dv.getUint16(local + 28, true);
    const data = u8.subarray(local + 30 + lnlen + lxlen, local + 30 + lnlen + lxlen + csize);
    const raw = method === 0 ? data : await inflateRaw(data);
    out[name] = dec.decode(raw);
  }
  return out;
}

function xmlText(s) {
  return s.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"')
          .replace(/&apos;/g, "'").replace(/&amp;/g, "&");
}

function colIndex(ref) { // "AB12" -> 27 (0-based)
  let n = 0;
  for (const ch of ref) { const c = ch.charCodeAt(0); if (c < 65 || c > 90) break; n = n * 26 + (c - 64); }
  return n - 1;
}

async function readXlsx(buf, sheetName) {
  const files = await unzip(buf, n => n.startsWith("xl/"));
  const shared = [];
  const sst = files["xl/sharedStrings.xml"];
  if (sst) {
    for (const m of sst.matchAll(/<si>([\s\S]*?)<\/si>/g)) {
      shared.push(xmlText([...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x => x[1]).join("")));
    }
  }
  let target = "xl/worksheets/sheet1.xml";
  const wb = files["xl/workbook.xml"], rels = files["xl/_rels/workbook.xml.rels"];
  if (wb && rels) {
    const sh = [...wb.matchAll(/<sheet [^>]*?name="([^"]*)"[^>]*?r:id="([^"]*)"/g)];
    const hit = sh.find(s => xmlText(s[1]) === sheetName) || sh[0];
    if (hit) {
      const rel = [...rels.matchAll(/<Relationship [^>]*?Id="([^"]*)"[^>]*?Target="([^"]*)"/g)]
        .concat([...rels.matchAll(/<Relationship [^>]*?Target="([^"]*)"[^>]*?Id="([^"]*)"/g)].map(m => [m[0], m[2], m[1]]))
        .find(r => r[1] === hit[2]);
      if (rel) target = rel[2].startsWith("/") ? rel[2].slice(1) : "xl/" + rel[2].replace(/^\.\//, "");
    }
  }
  const xml = files[target];
  if (!xml) throw new Error("Sheet not found in workbook");
  const rows = [];
  for (const rm of xml.matchAll(/<row\b[^>]*>([\s\S]*?)<\/row>/g)) {
    const row = [];
    for (const cm of rm[1].matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
      const attrs = cm[1], body = cm[2] || "";
      const r = /\br="([A-Z]+)\d+"/.exec(attrs), t = /\bt="([^"]*)"/.exec(attrs);
      const ci = r ? colIndex(r[1]) : row.length;
      let v = null;
      const vm = /<v>([\s\S]*?)<\/v>/.exec(body);
      if (t && t[1] === "s") v = vm ? shared[+vm[1]] : null;
      else if (t && t[1] === "inlineStr") { const im = /<t[^>]*>([\s\S]*?)<\/t>/.exec(body); v = im ? xmlText(im[1]) : ""; }
      else if (t && (t[1] === "str" || t[1] === "e")) v = vm ? xmlText(vm[1]) : null;
      else if (t && t[1] === "b") v = vm ? vm[1] === "1" : null;
      else v = vm ? parseFloat(vm[1]) : null;
      row[ci] = v;
    }
    rows.push(row);
  }
  return rows;
}

// Same logic as read_oxysoft() in the Python script.
function parseOxysoft(rows, S) {
  S = S || DEFAULTS;
  let rate = 10.0, inData = false;
  const t = [], o2 = [], hhb = [], events = [];
  for (const row of rows) {
    if (!row.length || row[0] === undefined || row[0] === null) continue;
    if (row[0] === "Export sample rate") rate = +row[1];
    else if (!inData && row[0] === 1 && row[1] === 2 && row[2] === 3) inData = true;
    else if (inData && typeof row[0] === "number" && row[S.o2Col - 1] != null) {
      const tt = row[0] / rate;
      t.push(tt); o2.push(+row[S.o2Col - 1]); hhb.push(+row[S.hhbCol - 1]);
      const code = row[S.eventCol - 1];
      if (code != null && tt > 0.5) {
        const text = row[S.textCol - 1];
        events.push([tt, String(code).trim(), String(text == null ? "" : text).trim()]);
      }
    }
  }
  return { t: Float64Array.from(t), o2: Float64Array.from(o2), hhb: Float64Array.from(hhb), events, rate };
}

// Guess the four protocol times from the event markers. A long occlusion is a marker followed
// 230-315 s later by the series start. When several markers qualify, the one where the
// 5-s cuff grid fits the tHb steps best is chosen (this needs the data D and the step array).
function guessMarks(events, D, S) {
  S = S || DEFAULTS;
  const tt = events.map(e => e[0]);
  const step = D ? stepSize(D) : null;
  const score = x => step ? locateCuffs(D.t, step, x, S).score : -Math.abs(x);
  function pairFrom(start) {
    for (let i = start; i < tt.length; i++) {
      const cands = [];
      for (let j = i + 1; j < tt.length; j++) {
        const d = tt[j] - tt[i];
        if (d >= 230 && d <= 315) cands.push(j);
      }
      if (!cands.length) continue;
      let best = cands[0], bs = score(tt[best]);
      for (const j of cands.slice(1)) { const sc = score(tt[j]); if (sc > bs) { bs = sc; best = j; } }
      return { i, j: best };
    }
    return null;
  }
  const p1 = pairFrom(0); if (!p1) return null;
  const next = tt.findIndex(v => v > tt[p1.j] + 40);
  const p2 = next >= 0 ? pairFrom(next) : null; if (!p2) return null;
  return { occl1_start: tt[p1.i], series1_start: tt[p1.j], occl2_start: tt[p2.i], series2_start: tt[p2.j] };
}

// ------------------------------------------------------------ signal processing
function lowerIdx(t, x) { let lo = 0, hi = t.length; while (lo < hi) { const m = (lo + hi) >> 1; if (t[m] < x) lo = m + 1; else hi = m; } return lo; }
function upperIdx(t, x) { let lo = 0, hi = t.length; while (lo < hi) { const m = (lo + hi) >> 1; if (t[m] <= x) lo = m + 1; else hi = m; } return lo; }

// Ryan correction over samples i0..i1-1, zeroed on samples with refA <= t <= refB.
function ryanRange(D, refA, refB, i0, i1) {
  const { t, o2, hhb } = D;
  const r0 = lowerIdx(t, refA), r1 = upperIdx(t, refB);
  let mo = 0, mh = 0;
  for (let i = r0; i < r1; i++) { mo += o2[i]; mh += hhb[i]; }
  mo /= (r1 - r0); mh /= (r1 - r0);
  const n = i1 - i0, oc = new Float64Array(n), hc = new Float64Array(n);
  for (let j = 0; j < n; j++) {
    const dO = o2[i0 + j] - mo, dH = hhb[i0 + j] - mh, dT = dO + dH;
    const tot = Math.abs(dO) + Math.abs(dH), beta = tot > 0 ? Math.abs(dO) / tot : 0.5;
    oc[j] = dO - dT * (1 - beta); hc[j] = dH - dT * beta;
  }
  return { oc, hc };
}

function stepSize(D) {
  const th = D.o2.map((v, i) => v + D.hhb[i]);
  const s = new Float64Array(th.length);
  for (let i = 1; i < th.length - 2; i++) s[i] = Math.abs(th[i + 2] - th[i - 1]);
  return s;
}

function nearestStep(t, step, t0, tol) {
  const a = lowerIdx(t, t0 - tol), b = upperIdx(t, t0 + tol);
  let best = -1, bi = 0;
  if (a >= b) return [t[0] + 0.1, -1];
  for (let i = a; i < b; i++) if (step[i] > best) { best = step[i]; bi = i; }
  return [t[bi] + 0.1, best];
}

function locateCuffs(t, step, start, S) {
  let best = null, bestScore = -Infinity;
  const nShift = Math.ceil((S.shiftHi + 0.01 - S.shiftLo) / 0.1);
  for (let k = 0; k < nShift; k++) {
    const shift = S.shiftLo + k * 0.1;
    let sc = 0;
    for (let i = 0; i < S.nCuffs; i++)
      for (const extra of [0.0, S.cuffDelay])
        sc += nearestStep(t, step, start + shift + S.cuffDelay + S.cycle * i + extra, 0.4)[1];
    if (sc > bestScore) { bestScore = sc; best = shift; }
  }
  const cuffs = [];
  for (let i = 0; i < S.nCuffs; i++) {
    const on = nearestStep(t, step, start + best + S.cuffDelay + S.cycle * i, 0.6)[0];
    const off = nearestStep(t, step, start + best + S.cycle * (i + 1), 0.6)[0];
    cuffs.push([on, off]);
  }
  return { shift: best, cuffs, score: bestScore };
}

function linfit(x, y) {
  const n = x.length; let sx = 0, sy = 0;
  for (let i = 0; i < n; i++) { sx += x[i]; sy += y[i]; }
  const mx = sx / n, my = sy / n; let sxx = 0, sxy = 0, syy = 0;
  for (let i = 0; i < n; i++) { const dx = x[i] - mx, dy = y[i] - my; sxx += dx * dx; sxy += dx * dy; syy += dy * dy; }
  const m = sxy / sxx;
  return { m, b: my - m * mx, r2: (sxy * sxy) / (sxx * syy) };
}

// curvature check: gain in R^2 from a quadratic over a straight line (0 unless the quadratic fits well)
function curvature(x, y) {
  const n = x.length; if (n < 5) return 0;
  const mx = x.reduce((a, b) => a + b) / n;
  const X = x.map(v => v - mx);
  let s = [0, 0, 0, 0, 0], r = [0, 0, 0];
  for (let i = 0; i < n; i++) { let p = 1; for (let k = 0; k < 5; k++) { s[k] += p; p *= X[i]; } r[0] += y[i]; r[1] += y[i] * X[i]; r[2] += y[i] * X[i] * X[i]; }
  const A = [[s[0], s[1], s[2]], [s[1], s[2], s[3]], [s[2], s[3], s[4]]];
  const c = solve3(A, r); if (!c) return 0;
  const my = r[0] / n; let sst = 0, ssq = 0;
  for (let i = 0; i < n; i++) { const f = c[0] + c[1] * X[i] + c[2] * X[i] * X[i]; ssq += (y[i] - f) ** 2; sst += (y[i] - my) ** 2; }
  const lin = linfit(x, y);
  const r2q = 1 - ssq / sst;
  return r2q >= 0.6 ? r2q - lin.r2 : 0;   // only a real curved trend counts, not curved noise
}
function solve3(A, b) {
  const M = A.map((row, i) => [...row, b[i]]);
  for (let c = 0; c < 3; c++) {
    let p = c; for (let r = c + 1; r < 3; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    if (Math.abs(M[p][c]) < 1e-300) return null; [M[c], M[p]] = [M[p], M[c]];
    for (let r = 0; r < 3; r++) if (r !== c) { const f = M[r][c] / M[c][c]; for (let k = c; k < 4; k++) M[r][k] -= f * M[c][k]; }
  }
  return [M[0][3] / M[0][0], M[1][3] / M[1][1], M[2][3] / M[2][2]];
}

// mVO2 for one window: Ryan-corrected HHb zeroed on [on-refWindow, on], slope over [t0, t1]
function correctedSlope(D, on, t0, t1, S) {
  const i0 = lowerIdx(D.t, t0), i1 = upperIdx(D.t, t1);
  const { hc } = ryanRange(D, on - S.refWindow, on, i0, i1);
  const x = Array.from(D.t.subarray(i0, i1));
  const f = linfit(x, Array.from(hc));
  return { slope: f.m, r2: f.r2, curv: curvature(x, Array.from(hc)) };
}

// ------------------------------------------------------------ exponential fits
const model = (t, end, delta, k) => end - delta * Math.exp(-t / k);

function fitRecovery(t, y, rest, S, anchor) {
  const n = t.length, lo = S.kLo, hi = S.kHi;
  if (n < 3) return {};
  const ymean = y.reduce((a, b) => a + b, 0) / n;
  const sst = y.reduce((a, v) => a + (v - ymean) ** 2, 0);
  const delta0 = rest - y[0];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const solvers = {
    "1-param": k => [rest, delta0],
    "2-param": k => { let se = 0, sd = 0; for (let i = 0; i < n; i++) { const e = Math.exp(-t[i] / k); se += e * e; sd += e * (rest - y[i]); }
                      return [rest, clamp(sd / se, -50, 50)]; },
    "3-param": k => { let s1 = 0, se = 0, see = 0, sy = 0, sey = 0;
                      for (let i = 0; i < n; i++) { const e = Math.exp(-t[i] / k); s1++; se += e; see += e * e; sy += y[i]; sey += e * y[i]; }
                      const det = s1 * see - se * se;
                      if (Math.abs(det) < 1e-14 * Math.max(1, s1 * see)) return [ymean, 0];
                      let end = (sy * see - se * sey) / det, b = (s1 * sey - se * sy) / det; // y = end + b*e
                      let delta = -b;
                      if (end < -50 || end > 50) { end = clamp(end, -50, 50); delta = 0; for (let i = 0; i < n; i++) {} let num = 0; for (let i = 0; i < n; i++) { const e = Math.exp(-t[i] / k); num += e * (end - y[i]); } delta = clamp(num / see, -50, 50); }
                      else if (delta < -50 || delta > 50) { delta = clamp(delta, -50, 50); let s = 0; for (let i = 0; i < n; i++) s += y[i] + delta * Math.exp(-t[i] / k); end = clamp(s / n, -50, 50); }
                      return [end, delta]; },
    // anchored: End = rest and the curve passes through the end-of-exercise value ex at time tEx
    "anchored": k => [rest, (rest - anchor[1]) * Math.exp(anchor[0] / k)],
  };
  const out = {};
  for (const name of FITS) {
    if (name === "anchored" && !anchor) continue;
    const sse = k => { const [e, d] = solvers[name](k); let s = 0; for (let i = 0; i < n; i++) s += (y[i] - model(t[i], e, d, k)) ** 2; return s; };
    // global search on a log grid of k, then golden-section refinement
    const N = 3000, L0 = Math.log(lo), L1 = Math.log(hi);
    let bi = 0, bv = Infinity; const vals = new Float64Array(N + 1);

function groupStats() {
  const out = [];

    for (const sid of ST.order) { const s = ST.subj[sid]; if (!s.res || !s.res.series[name].fits[fn]) continue; if (usable(s, name, fn)) { ids.push(sid); v.push(s.res.series[name].fits[fn].rate); } }
    const n = v.length, mean = n ? v.reduce((a, b) => a + b) / n : NaN;
    const sd = n > 1 ? Math.sqrt(v.reduce((a, b) => a + (b - mean) ** 2, 0) / (n - 1)) : NaN;
    const so = [...v].sort((a, b) => a - b), med = n ? (n % 2 ? so[(n - 1) / 2] : (so[n / 2 - 1] + so[n / 2]) / 2) : NaN;
    out.push({ name, fn, n, mean, sd, med, min: so[0], max: so[n - 1], ids });
  }
  return out;
}

    for (const name of SERIES) for (const fn of fitsFor(name)) { const ft = s.res.series[name].fits[fn]; const u = ft && usable(s, name, fn); const unres = !ft || ft.k >= ST.S.usableKHi || ft.k < ST.S.usableKLo;
      h += `<td class="num ${u ? "u" : "nu"}">${unres ? "–" : f(ft.rate, 2)} <span class=muted>(${ft ? f(ft.R2, 2) : "–"})</span></td>`; }

  for (const sid of ST.order) { const s = ST.subj[sid]; if (!s.res) continue; const r = s.res;
    sj.push([sid, s.exclude, f(r.rest, 5), f(r.restWin[0], 1), f(r.restWin[1], 1), f(r.endEx, 5), f(r.endExWin[0], 1), f(r.endExWin[1], 1), editsCount(s), s.note]); }
  setTimeout(() => download("subjects.csv", sj.map(csvLine).join("\n")), 1200);
}
function buildPrint() {
  const P = $("#print"); P.innerHTML = "";
  const p1 = document.createElement("div"); p1.className = "pg";
  p1.innerHTML = `<h2>NIRS mVO₂ recovery analysis</h2><p class="help">${ST.order.length} subjects · Ryan |β| correction · slope window ${ST.S.slopeStart} s after cuff-on to ${ST.S.slopeTrim} s before cuff-off · printed ${new Date().toLocaleString()}</p>${summaryHTML()}`;
  P.appendChild(p1);
  for (const sid of ST.order) {
    const s = ST.subj[sid]; if (!s.res) continue;
    const pg = document.createElement("div"); pg.className = "pg";
    pg.innerHTML = `<h2>Subject ${esc(sid)}${s.exclude ? " (excluded)" : ""}${editsCount(s) ? ` · ${editsCount(s)} manual edit(s)` : ""} ${s.note ? "· " + esc(s.note) : ""}</h2>`;
    pg.appendChild(overviewPlot(s, false));
    const g2 = document.createElement("div"); g2.className = "grid2";
    for (const name of SERIES) { const d = document.createElement("div"); d.appendChild(fitPlot(s, name)); g2.appendChild(d); }
    pg.appendChild(g2); P.appendChild(pg);
    const pg2 = document.createElement("div"); pg2.className = "pg";
    pg2.innerHTML = `<h2>Subject ${esc(sid)}: 5-s cuffs</h2>`;
    for (const name of SERIES) { const h = document.createElement("div"); h.className = "help"; h.textContent = name; pg2.appendChild(h); const g = document.createElement("div"); g.className = "grid6"; s.res.series[name].occ.forEach((c, i) => g.appendChild(cuffPanel(s, name, i, false))); pg2.appendChild(g); }
    const rw = document.createElement("div"); rw.style.cssText = "display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:1040px"; rw.appendChild(windowPlot(s, "rest", false)); rw.appendChild(windowPlot(s, "endex", false)); pg2.appendChild(rw);
    P.appendChild(pg2);
  }
}

// ------------------------------------------------------------ wiring
$("#fileIn").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
$("#protIn").onchange = async e => { const fl = e.target.files[0]; if (fl) loadProtocol(await fl.text()); e.target.value = ""; };
$("#sessIn").onchange = async e => { const fl = e.target.files[0]; if (!fl) return; try { applySession(JSON.parse(await fl.text())); recomputeAll(); status("Session loaded"); } catch (err) { alert("Could not read session file: " + err.message); } e.target.value = ""; };
$("#saveSess").onclick = () => download("nirs_mvo2_session.json", JSON.stringify(snapshot(), null, 1), "application/json");
$("#expCsv").onclick = () => { if (ST.order.length) exportCSVs(); };
$("#printBtn").onclick = () => { if (!ST.order.length) return; buildPrint(); setTimeout(() => window.print(), 100); };
$("#setBtn").onclick = () => { ST.showSettings = !ST.showSettings; render(); };
document.addEventListener("dragover", e => { e.preventDefault(); const d = $("#drop"); if (d) d.classList.add("hover"); });
document.addEventListener("dragleave", () => { const d = $("#drop"); if (d) d.classList.remove("hover"); });
document.addEventListener("drop", e => { e.preventDefault(); const fl = [...e.dataTransfer.files]; const csv = fl.find(x => /\.csv$/i.test(x.name)); if (csv) csv.text().then(loadProtocol); addFiles(fl); });
window.__ST = ST; window.__addFiles = addFiles; window.__loadProtocol = loadProtocol;
render();
})();

</script>
